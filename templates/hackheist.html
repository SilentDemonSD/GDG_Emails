<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackHeist 2k26</title>
</head>

<body style="margin:0; padding:0; background:#f5f5f5;">

  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!-- GOOGLE BORDER WRAPPER -->
        <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="
          border-top:3px solid #1a73e8;
          border-right:3px solid #fbbc04;
          border-bottom:3px solid #ea4335;
          border-left:3px solid #34a853;
          background:#0b0b0b;
          border-radius:14px;
        ">

          <tr>
            <td style="font-family:Arial, Helvetica, sans-serif; color:#eaeaea; border-radius:14px;">

              <!-- HEADER IMAGE -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center" style="padding:18px 28px 10px 28px;">
                    <img src="https://iili.io/qB8QLfj.md.png" width="544" alt="HackHeist 2k26"
                      style="display:block; width:100%; max-width:544px; height:auto; border-radius:8px;">
                  </td>
                </tr>
              </table>

              <!-- RED DIVIDER -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td style="padding:0 28px;">
                    <div style="height:3px; background:#e50914; line-height:3px; font-size:3px;">&nbsp;</div>
                  </td>
                </tr>
              </table>

              <!-- CONTENT -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td style="padding:20px 28px 32px 28px; font-size:14px; line-height:1.7;">
                    {{CONTENT}}
                  </td>
                </tr>
              </table>

              <!-- RED DIVIDER -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td style="padding:0 28px;">
                    <div style="height:3px; background:#e50914;">&nbsp;</div>
                  </td>
                </tr>
              </table>

              <!-- FOOTER IMAGE -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center" style="padding:18px 28px 12px 28px;">
                    <img src="https://iili.io/qB8QQ0x.md.png" width="544" alt="Footer"
                      style="display:block; width:100%; max-width:544px; height:auto; border-radius:8px;">
                  </td>
                </tr>
              </table>

              <!-- FOOTER -->
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                  <td align="center" style="padding:0 28px 26px 28px;">

                    <table cellpadding="0" cellspacing="0" role="presentation"
                      style="font-family:Arial, Helvetica, sans-serif; color:#bdbdbd;">

                      <tr>
                        <td align="center">
                          <table cellpadding="0" cellspacing="0" role="presentation">
                            <tr>
                              <td valign="middle" style="padding-right:10px;">
                                <img src="https://iili.io/fQrxsP1.png" width="42" alt="GDG Logo" style="display:block;">
                              </td>
                              <td valign="middle">
                                <span style="font-size:14px; font-weight:700; color:#ffffff;">
                                  GDG On Campus MIET
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <tr>
                        <td align="center" style="padding-top:8px; font-size:12px; line-height:1.6;">
                          Meerut Institute of Engineering and Technology (MIET)<br>
                          NH-58, Delhi–Roorkee Bypass Road, Meerut – 250005, Uttar Pradesh, India
                        </td>
                      </tr>

                    </table>

                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
        <!-- END GOOGLE BORDER -->

      </td>
    </tr>
  </table>

</body>

</html>
